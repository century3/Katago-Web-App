# ===========================
# KataGo CUDA GTP — 极强棋力（RTX 5070 Ti 16GB）
# 权重：kata1-zhizi-b40c768nbt-s11272M-d5935M（由 server 启动参数指定）
#
# 重要：人机每手实际算力 = 网页 kata-genmove_analyze 的 N（KATAGO_DEFAULT_VISITS）
# 本文件决定搜索效率与是否减算力；要“很强”请配合：
#   - start_server_strong.bat（1 进程 + 高 visits）或
#   - start_server_multigame.bat（当前默认 1000 visits）
# 可用 katago benchmark 微调 numSearchThreads / nnMaxBatchSize
# ===========================

# --- GPU ---
useFP16 = true
cudaUseFP16 = true
cudaDeviceToUse = 0
# 多进程时保持 1，避免同卡 NN 服务线程互相抢
numNNServerThreads = 1
# 与高 visits / 多搜索线程匹配；POOL=2 若 OOM 可降到 192
nnMaxBatchSize = 256
# 2^21 ≈ 200 万条缓存（高 visits 收益大）；POOL=2 显存紧可改回 20
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 16
# 8 对称随机评估，略涨 Elo（不要关）
nnRandomize = true
nnPolicyTemperature = 1.0

# --- 搜索线程（5070 Ti 单进程可吃满 GPU；双进程时合计约 28–32 线程） ---
numSearchThreads = 16

# --- 搜索上限（genmove / 未带 N 的命令；analyze 以命令内 visits 为准） ---
maxVisits = 50000
#maxPlayouts = 0
maxTime = 0

# 对方思考时继续搜（显著增强人机对弈体感棋力；多盘并行若卡顿可改 false）
ponderingEnabled = true
maxVisitsPondering = 50000
maxTimePondering = 180.0

# --- 全算力：不要因领先 / 对方 pass 而少搜（官方对打配置会注释掉这些） ---
# searchFactorWhenWinning = 1.0
# searchFactorWhenWinningThreshold = 0.95
# searchFactorAfterOnePass = 1.0
# searchFactorAfterTwoPass = 1.0

# 交互分析记忆：帮 KataGo「记住」已算透的变化，后续更强
useEvalCache = true
evalCacheMinVisits = 50

# --- 选点：偏确定性，减少「乱下」 ---
# 开局稍有温度，中后盘更贴最高 visits 着
chosenMoveTemperatureEarly = 0.15
chosenMoveTemperatureHalflife = 30
chosenMoveTemperature = 0.02
chosenMoveSubtract = 0
chosenMovePrune = 1
useLcbForSelection = true

# 探索略偏稳健（默认附近微调即可）
cpuctExploration = 1.0
cpuctExplorationLog = 0.45
subtreeValueBiasFactor = 0.45
subtreeValueBiasWeightExponent = 0.85

# --- 规则 ---
rules = chinese
komi = 7.5
boardSizeX = 19
boardSizeY = 19

# --- 投降（极强时仍允许合理认输） ---
allowResignation = true
resignThreshold = -0.99
resignConsecTurns = 5
resignMinScoreDifference = 15
resignMinMovesPerBoardArea = 0.35

# --- GTP 日志 ---
gtpLogToStderr = true
gtpLogToFile = false
logSearchInfo = false
logAllGTPCommunication = false
lagBuffer = 0.5
