<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataGo 围棋对弈界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #eaeaea;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .board-section {
            flex: 3;
            min-width: 600px;
        }
        
        .control-section {
            flex: 2;
            min-width: 400px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .board-container {
            position: relative;
            background: #dcb35c;
            border-radius: 15px;
            padding: 50px 50px 50px 30px; /* 左内边距小一些给行标签留空间 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        #go-board {
            display: block;
            background: #dcb35c;
            border: 3px solid #8b4513;
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(139, 69, 19, 0.3);
        }
        
        .board-labels {
            position: absolute;
            font-family: monospace;
            font-weight: bold;
            color: #5d4037;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }
        
        /* 修改这里：行标签在棋盘最左边网格线的左边 */
        .row-labels {
            left: 10px;  /* 棋盘左边网格线的左边 */
            top: 50px;   /* 与棋盘上边缘对齐 */
            height: calc(100% - 100px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* 修改这里：列标签在棋盘最上边的网格线的上边 */
        .col-labels {
            top: 15px;   /* 棋盘上边网格线的上边 */
            left: 50px;  /* 与棋盘左边缘对齐 */
            width: calc(100% - 80px);
            display: flex;
            justify-content: space-between;
        }
        
        .label {
            width: 25px;
            height: 25px;
            text-align: center;
            line-height: 25px;
            font-size: 14px;
            font-weight: bold;
        }
        
        /* 控制面板样式保持不变... */
        
        .control-group {
            margin-bottom: 25px;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eaeaea;
            font-size: 1.5em;
        }
        
        .server-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        
        .info-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .info-label {
            font-weight: bold;
            min-width: 120px;
            color: #555;
        }
        
        .info-value {
            flex: 1;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 14px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-connected {
            background: #27ae60;
            box-shadow: 0 0 10px #27ae60;
        }
        
        .status-disconnected {
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #3498db;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .command-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: monospace;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        .command-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .log-container {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            animation: fadeIn 0.3s;
            word-break: break-word;
        }
        
        .log-sent {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .log-received {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        
        .log-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulsing {
            animation: pulse 2s infinite;
        }
        
        /* 调试样式 */
        .debug-point {
            position: absolute;
            width: 4px;
            height: 4px;
            background: red;
            border-radius: 50%;
            z-index: 100;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .board-section, .control-section {
                min-width: 100%;
            }
            
            .board-container {
                padding: 30px 30px 30px 20px;
            }
            
            #go-board {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎴 KataGo 围棋对弈界面</h1>
            <div class="subtitle">连接本地 KataGo HTTP 服务器，实现人机对弈</div>
        </header>
        
        <div class="main-content">
            <div class="board-section">
                <div class="board-container">
                    <!-- 行标签：显示数字 19 到 1（从上到下） -->
                    <div class="row-labels board-labels" id="row-labels"></div>
                    <!-- 列标签：显示字母 A 到 T（从左到右） -->
                    <div class="col-labels board-labels" id="col-labels"></div>
                    <canvas id="go-board"></canvas>
                </div>
                <div class="move-history" id="move-history">
                    <h3>着法历史</h3>
                    <div id="history-list"></div>
                </div>
            </div>
            
            <div class="control-section">
                <div class="control-group">
                    <h2>服务器连接</h2>
                    <div class="server-info">
                        <div class="info-item">
                            <span class="info-label">服务器状态:</span>
                            <span id="server-status" class="info-value">
                                <span class="status-indicator status-disconnected"></span>
                                <span>未连接</span>
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">服务器地址:</span>
                            <span class="info-value" id="server-url">http://localhost:5001/gtp</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">KataGo 颜色:</span>
                            <span class="info-value" id="katago-color">白色 (W)</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">当前回合:</span>
                            <span class="info-value" id="current-turn">黑方</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">棋盘尺寸:</span>
                            <span class="info-value">19 × 19</span>
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <h2>游戏控制</h2>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btn-start" onclick="startNewGame()">
                            🆕 新游戏
                        </button>
                        <button class="btn btn-secondary" id="btn-katago-move" onclick="requestKataGoMove()">
                            🤖 KataGo 思考
                        </button>
                        <button class="btn btn-danger" id="btn-clear" onclick="clearBoard()">
                            🗑️ 清空棋盘
                        </button>
                        <button class="btn btn-secondary" id="btn-undo" onclick="undoMove()">
                            ↩️ 悔棋
                        </button>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="setKataGoColor('B')">
                            ⚫ KataGo 执黑
                        </button>
                        <button class="btn btn-secondary" onclick="setKataGoColor('W')">
                            ⚪ KataGo 执白
                        </button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h2>GTP 命令</h2>
                    <input type="text" class="command-input" id="command-input" 
                           value="kata-genmove_analyze W 50" 
                           placeholder="输入 GTP 命令，如: kata-genmove_analyze W 50">
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="sendCommand()">
                            📨 发送命令
                        </button>
                        <button class="btn btn-secondary" onclick="testConnection()">
                            🔗 测试连接
                        </button>
                        <button class="btn btn-secondary" onclick="showGridPoints()">
                            📍 显示网格点
                        </button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h2>通信日志</h2>
                    <div class="log-container" id="log-container">
                        <div class="log-entry">等待连接服务器...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        const SERVER_URL = 'http://localhost:5001/gtp';
        let canvas, ctx;
        let boardSize = 19;
        let cellSize = 32;
        let margin = 40;
        let stones = [];
        let katagoColor = 'W';
        let humanColor = 'B';
        let currentTurn = 'B';
        let moveHistory = [];
        let isGameActive = false;
        let lastMoveStone = null;
        let boardWidth, boardHeight;

        // 初始化棋盘
        function initBoard() {
            canvas = document.getElementById('go-board');
            ctx = canvas.getContext('2d');
            
            // 计算棋盘尺寸
            boardWidth = boardHeight = (boardSize - 1) * cellSize + margin * 2;
            
            canvas.width = boardWidth;
            canvas.height = boardHeight;
            canvas.style.width = boardWidth + 'px';
            canvas.style.height = boardHeight + 'px';
            
            console.log(`棋盘尺寸: ${boardWidth}x${boardHeight}, 格子: ${cellSize}, 边距: ${margin}`);
            console.log(`网格范围: X(${margin} ~ ${boardWidth - margin}), Y(${margin} ~ ${boardHeight - margin})`);
            
            drawBoard();
            createBoardLabels();
            testConnection();
            
            // 添加点击事件
            canvas.addEventListener('click', handleBoardClick);
        }

        // 绘制棋盘
        function drawBoard() {
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 绘制背景色
            ctx.fillStyle = '#dcb35c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 2. 绘制边框
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
            
            // 3. 绘制网格线
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            
            // 横线
            for (let i = 0; i < boardSize; i++) {
                const y = margin + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(margin, y);
                ctx.lineTo(boardWidth - margin, y);
                ctx.stroke();
            }
            
            // 竖线
            for (let i = 0; i < boardSize; i++) {
                const x = margin + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(x, margin);
                ctx.lineTo(x, boardHeight - margin);
                ctx.stroke();
            }
            
            // 4. 绘制星位点
            drawStarPoints();
            
            // 5. 绘制棋子
            drawStones();
            
            console.log('棋盘绘制完成');
        }

        // 绘制星位点
        function drawStarPoints() {
            const starPoints = [3, 9, 15];
            const starRadius = 4;
            
            ctx.fillStyle = '#000000';
            
            for (let xIndex of starPoints) {
                for (let yIndex of starPoints) {
                    // 只在关键位置绘制星位
                    if ((xIndex === 9 && yIndex === 9) || // 天元
                        (xIndex === 3 && yIndex === 3) || // 左上角
                        (xIndex === 3 && yIndex === 15) || // 左下角
                        (xIndex === 15 && yIndex === 3) || // 右上角
                        (xIndex === 15 && yIndex === 15)) { // 右下角
                        
                        const x = margin + xIndex * cellSize;
                        const y = margin + yIndex * cellSize;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, starRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        // 绘制所有棋子
        function drawStones() {
            stones.forEach(stone => {
                drawStone(stone.x, stone.y, stone.color, stone.moveNumber);
            });
        }

        // 绘制单个棋子
        function drawStone(boardX, boardY, color, moveNumber = null) {
            const x = margin + boardX * cellSize;
            const y = margin + boardY * cellSize;
            const radius = cellSize * 0.45;
            
            // 创建渐变
            const gradient = ctx.createRadialGradient(
                x - radius/3, y - radius/3, 1,
                x, y, radius
            );
            
            if (color === 'B') {
                gradient.addColorStop(0, '#666');
                gradient.addColorStop(1, '#000');
            } else {
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(1, '#ccc');
            }
            
            // 绘制棋子
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 白棋加边框
            if (color === 'W') {
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // 如果是最后落子，加高亮边框
            if (lastMoveStone && lastMoveStone.x === boardX && lastMoveStone.y === boardY) {
                ctx.beginPath();
                ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            
            // 绘制手数编号
            if (moveNumber && moveNumber > 0) {
                ctx.fillStyle = color === 'B' ? '#fff' : '#000';
                ctx.font = `bold ${Math.floor(cellSize * 0.35)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.strokeStyle = color === 'B' ? '#000' : '#fff';
                ctx.lineWidth = 1;
                ctx.strokeText(moveNumber, x, y);
                ctx.fillText(moveNumber, x, y);
            }
        }

        // 创建棋盘坐标标签 - 根据描述修改
        function createBoardLabels() {
            const rowLabels = document.getElementById('row-labels');
            const colLabels = document.getElementById('col-labels');
            
            // 清空现有标签
            rowLabels.innerHTML = '';
            colLabels.innerHTML = '';
            
            // 修改1: 行标签应该是数字 19 到 1（从上到下）
            for (let i = 0; i < boardSize; i++) {
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = boardSize - i; // 19, 18, ..., 1
                label.style.transform = `translateY(${cellSize/2 - 12}px)`;
                rowLabels.appendChild(label);
            }
            
            // 修改2: 列标签应该是字母 A 到 T（从左到右，跳过I）
            const colLetters = [];
            for (let i = 0; i < 26; i++) {
                let letter = String.fromCharCode(65 + i);
                if (letter === 'I') continue; // 跳过I
                if (colLetters.length >= 19) break;
                colLetters.push(letter);
            }
            
            // 添加列标签
            for (let i = 0; i < boardSize; i++) {
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = colLetters[i];
                label.style.transform = `translateX(${cellSize/2 - 12}px)`;
                colLabels.appendChild(label);
            }
            
            console.log('坐标标签创建完成');
            console.log('左边：数字19到1（从上到下）');
            console.log('上边：字母A到T（从左到右）');
        }

        // 显示网格点（调试用）
        function showGridPoints() {
            // 移除已有的调试点
            document.querySelectorAll('.debug-point').forEach(el => el.remove());
            
            // 创建调试点
            const boardContainer = document.querySelector('.board-container');
            
            for (let x = 0; x < boardSize; x++) {
                for (let y = 0; y < boardSize; y++) {
                    const point = document.createElement('div');
                    point.className = 'debug-point';
                    
                    // 计算网格点的实际位置
                    const pointX = margin + x * cellSize;
                    const pointY = margin + y * cellSize;
                    
                    point.style.left = `${pointX - 2}px`;
                    point.style.top = `${pointY - 2}px`;
                    
                    boardContainer.appendChild(point);
                }
            }
            
            addLog('调试', '已显示所有网格交叉点（红色圆点）');
        }

        // 坐标转换：棋盘坐标转数组索引 - 需要根据新的坐标布局调整
        function coordinateToIndex(coord) {
            if (!coord || coord.length < 2) {
                return null;
            }
            
            const colChar = coord[0].toUpperCase();
            const rowStr = coord.substring(1);
            
            if (coord.toUpperCase() === 'PASS') {
                return { x: -1, y: -1, isPass: true };
            }
            
            // 列转换：A=0, B=1, ..., H=7, J=8, ..., T=18 (跳过I)
            let col = colChar.charCodeAt(0) - 65;
            if (col >= 8) col--; // 跳过I
            
            // 行转换：现在左边标签从上到下是19到1
            // 所以棋盘顶部是19，底部是1
            // 但我们需要转换为数组索引：0=顶部，18=底部
            let row;
            try {
                row = parseInt(rowStr) - 1; // 1变成0，19变成18
                row = 18 - row; // 翻转，使顶部为0，底部为18
            } catch (e) {
                return null;
            }
            
            if (col < 0 || col >= boardSize || row < 0 || row >= boardSize) {
                return null;
            }
            
            return { x: col, y: row };
        }

        // 坐标转换：数组索引转棋盘坐标
        function indexToCoordinate(x, y) {
            if (x < 0 || x >= boardSize || y < 0 || y >= boardSize) {
                return 'PASS';
            }
            
            // 列：0=A, 1=B, ..., 7=H, 8=J, ..., 18=T (跳过I)
            let colChar;
            if (x < 8) {
                colChar = String.fromCharCode(65 + x);
            } else {
                colChar = String.fromCharCode(66 + x);
            }
            
            // 行：数组索引y：0=顶部，18=底部
            // 转换为标签显示：顶部是19，底部是1
            const row = 19 - y;
            
            return `${colChar}${row}`;
        }

        // 处理棋盘点击
        function handleBoardClick(event) {
            if (!isGameActive) {
                alert('请先开始新游戏！');
                return;
            }
            
            if (currentTurn !== humanColor) {
                alert(`现在轮到 KataGo 落子（执${katagoColor === 'B' ? '黑' : '白'}）`);
                return;
            }
            
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            
            // 计算最近的交叉点
            const gridX = Math.round((clickX - margin) / cellSize);
            const gridY = Math.round((clickY - margin) / cellSize);
            
            // 检查是否在棋盘范围内
            if (gridX >= 0 && gridX < boardSize && gridY >= 0 && gridY < boardSize) {
                // 落子
                if (placeStone(gridX, gridY, humanColor)) {
                    // 如果是 KataGo 回合，自动请求 KataGo 思考
                    if (currentTurn === katagoColor) {
                        setTimeout(() => {
                            requestKataGoMove();
                        }, 500);
                    }
                }
            }
        }

        // 落子
        function placeStone(x, y, color) {
            // 检查该位置是否已有棋子
            if (stones.some(stone => stone.x === x && stone.y === y)) {
                addLog('错误', `位置 ${indexToCoordinate(x, y)} 已有棋子`, 'error');
                return false;
            }
            
            const moveNumber = stones.length + 1;
            const stone = { x, y, color, moveNumber };
            stones.push(stone);
            lastMoveStone = stone;
            moveHistory.push(stone);
            
            // 重绘棋盘
            drawBoard();
            
            // 切换回合
            currentTurn = color === 'B' ? 'W' : 'B';
            updateStatus();
            
            addLog('落子', `${color === 'B' ? '黑' : '白'}棋落子 ${indexToCoordinate(x, y)} (第${moveNumber}手)`);
            
            return true;
        }

        // 处理 KataGo 返回的着法
        function processKataGoMove(response) {
            try {
                const data = typeof response === 'string' ? JSON.parse(response) : response;
                
                if (data.success && data.result) {
                    const result = data.result;
                    
                    if (result.startsWith('= play ')) {
                        const move = result.substring(7).trim();
                        const coord = coordinateToIndex(move);
                        
                        if (coord) {
                            if (coord.isPass || move.toUpperCase() === 'PASS') {
                                addLog('KataGo', 'KataGo 选择 PASS');
                                currentTurn = currentTurn === 'B' ? 'W' : 'B';
                                updateStatus();
                                return;
                            }
                            
                            if (placeStone(coord.x, coord.y, katagoColor)) {
                                addLog('KataGo', `KataGo 落子 ${move}`);
                            }
                        }
                    }
                }
            } catch (error) {
                addLog('错误', `解析响应失败: ${error.message}`, 'error');
            }
        }

        // 发送 GTP 命令
        async function sendCommand() {
            const commandInput = document.getElementById('command-input');
            const command = commandInput.value.trim();
            
            if (!command) {
                alert('请输入 GTP 命令');
                return;
            }
            
            addLog('发送', command, 'sent');
            
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ command })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                addLog('接收', JSON.stringify(data), 'received');
                
                if (command.includes('kata-genmove_analyze')) {
                    processKataGoMove(data);
                }
                
            } catch (error) {
                addLog('错误', `请求失败: ${error.message}`, 'error');
            }
        }

        // 请求 KataGo 思考
        async function requestKataGoMove() {
            if (!isGameActive) {
                alert('请先开始新游戏！');
                return;
            }
            
            if (currentTurn !== katagoColor) {
                alert(`现在轮到${currentTurn === 'B' ? '黑' : '白'}方落子`);
                return;
            }
            
            const command = `kata-genmove_analyze ${katagoColor} 50`;
            document.getElementById('command-input').value = command;
            
            addLog('发送', command, 'sent');
            
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ command })
                });
                
                const data = await response.json();
                addLog('接收', JSON.stringify(data), 'received');
                
                processKataGoMove(data);
                
            } catch (error) {
                addLog('错误', `请求失败: ${error.message}`, 'error');
            }
        }

        // 开始新游戏
        function startNewGame() {
            stones = [];
            moveHistory = [];
            lastMoveStone = null;
            currentTurn = 'B';
            isGameActive = true;
            
            // 重绘棋盘
            drawBoard();
            
            updateStatus();
            
            addLog('游戏', '新游戏开始！');
            
            // 如果 KataGo 执黑，让它先走
            if (katagoColor === 'B') {
                setTimeout(() => {
                    requestKataGoMove();
                }, 500);
            }
        }

        // 清空棋盘
        function clearBoard() {
            stones = [];
            moveHistory = [];
            lastMoveStone = null;
            drawBoard();
            addLog('棋盘', '棋盘已清空');
        }

        // 悔棋
        function undoMove() {
            if (stones.length === 0) {
                addLog('悔棋', '没有可悔的着法');
                return;
            }
            
            const lastStone = stones.pop();
            moveHistory.pop();
            
            lastMoveStone = stones.length > 0 ? stones[stones.length - 1] : null;
            
            currentTurn = lastStone.color === 'B' ? 'B' : 'W';
            
            drawBoard();
            updateStatus();
            
            addLog('悔棋', `撤消 ${lastStone.color === 'B' ? '黑' : '白'}棋 ${indexToCoordinate(lastStone.x, lastStone.y)}`);
        }

        // 设置 KataGo 颜色
        function setKataGoColor(color) {
            katagoColor = color;
            humanColor = color === 'B' ? 'W' : 'B';
            
            document.getElementById('katago-color').textContent = 
                `${color === 'B' ? '黑色 (B)' : '白色 (W)'}`;
            
            addLog('设置', `KataGo 执${color === 'B' ? '黑' : '白'}，人类执${humanColor === 'B' ? '黑' : '白'}`);
            updateStatus();
        }

        // 测试服务器连接
        async function testConnection() {
            const statusElement = document.getElementById('server-status');
            const indicator = statusElement.querySelector('.status-indicator');
            const textSpan = statusElement.querySelector('span:last-child');
            
            indicator.className = 'status-indicator status-disconnected';
            textSpan.textContent = '连接中...';
            
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: 'protocol_version' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success) {
                        indicator.className = 'status-indicator status-connected';
                        textSpan.textContent = '已连接';
                        addLog('连接', '服务器连接成功！', 'received');
                    }
                }
                
            } catch (error) {
                indicator.className = 'status-indicator status-disconnected';
                textSpan.textContent = '连接失败';
                addLog('连接', `无法连接到服务器: ${error.message}`, 'error');
            }
        }

        // 更新状态显示
        function updateStatus() {
            document.getElementById('current-turn').textContent = 
                `${currentTurn === 'B' ? '黑方' : '白方'}${currentTurn === katagoColor ? ' (KataGo)' : ' (人类)'}`;
            
            const btn = document.getElementById('btn-katago-move');
            if (currentTurn === katagoColor && isGameActive) {
                btn.disabled = false;
                btn.classList.add('pulsing');
            } else {
                btn.disabled = true;
                btn.classList.remove('pulsing');
            }
        }

        // 添加日志
        function addLog(type, message, cssClass = '') {
            const logContainer = document.getElementById('log-container');
            const logEntry = document.createElement('div');
            
            const timestamp = new Date().toLocaleTimeString();
            logEntry.className = `log-entry log-${cssClass || 'received'}`;
            logEntry.innerHTML = `<strong>[${timestamp}] ${type}:</strong> ${message}`;
            
            logContainer.appendChild(logEntry);
            
            if (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.firstChild);
            }
            
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 初始化
        window.onload = initBoard;
        
        console.log('围棋界面已加载');
    </script>
</body>
</html>
