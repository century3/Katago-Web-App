<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataGo 围棋对弈界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #eaeaea;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .board-section {
            flex: 3;
            min-width: 600px;
        }
        
        .control-section {
            flex: 2;
            min-width: 400px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .board-container {
            position: relative;
            background: #dcb35c;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        #go-board {
            display: block;
            background: #dcb35c;
            border: 3px solid #8b4513;
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(139, 69, 19, 0.3);
        }
        
        .board-labels {
            position: absolute;
            font-family: monospace;
            font-weight: bold;
            color: #5d4037;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }
        
        .row-labels {
            left: 15px;
            top: 40px;
            height: calc(100% - 80px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .col-labels {
            top: 15px;
            left: 40px;
            width: calc(100% - 80px);
            display: flex;
            justify-content: space-between;
        }
        
        .label {
            width: 25px;
            height: 25px;
            text-align: center;
            line-height: 25px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eaeaea;
            font-size: 1.5em;
        }
        
        .server-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        
        .info-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .info-label {
            font-weight: bold;
            min-width: 120px;
            color: #555;
        }
        
        .info-value {
            flex: 1;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 14px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-connected {
            background: #27ae60;
            box-shadow: 0 0 10px #27ae60;
        }
        
        .status-disconnected {
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #3498db;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .command-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: monospace;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        .command-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .log-container {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            animation: fadeIn 0.3s;
            word-break: break-word;
        }
        
        .log-sent {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .log-received {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        
        .log-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulsing {
            animation: pulse 2s infinite;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .board-section, .control-section {
                min-width: 100%;
            }
            
            .board-container {
                padding: 20px;
            }
            
            #go-board {
                width: 100%;
                height: auto;
            }
        }
        
        .debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎴 KataGo 围棋对弈界面</h1>
            <div class="subtitle">连接本地 KataGo HTTP 服务器，实现人机对弈</div>
        </header>
        
        <div class="main-content">
            <div class="board-section">
                <div class="board-container">
                    <div class="row-labels board-labels" id="row-labels"></div>
                    <div class="col-labels board-labels" id="col-labels"></div>
                    <canvas id="go-board"></canvas>
                </div>
                <div class="move-history" id="move-history">
                    <h3>着法历史</h3>
                    <div id="history-list"></div>
                </div>
            </div>
            
            <div class="control-section">
                <div class="control-group">
                    <h2>服务器连接</h2>
                    <div class="server-info">
                        <div class="info-item">
                            <span class="info-label">服务器状态:</span>
                            <span id="server-status" class="info-value">
                                <span class="status-indicator status-disconnected"></span>
                                <span>未连接</span>
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">服务器地址:</span>
                            <span class="info-value" id="server-url">http://localhost:5001/gtp</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">KataGo 颜色:</span>
                            <span class="info-value" id="katago-color">白色 (W)</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">当前回合:</span>
                            <span class="info-value" id="current-turn">黑方</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">棋盘尺寸:</span>
                            <span class="info-value">19 × 19</span>
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <h2>游戏控制</h2>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btn-start" onclick="startNewGame()">
                            🆕 新游戏
                        </button>
                        <button class="btn btn-secondary" id="btn-katago-move" onclick="requestKataGoMove()">
                            🤖 KataGo 思考
                        </button>
                        <button class="btn btn-danger" id="btn-clear" onclick="clearBoard()">
                            🗑️ 清空棋盘
                        </button>
                        <button class="btn btn-secondary" id="btn-undo" onclick="undoMove()">
                            ↩️ 悔棋
                        </button>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="setKataGoColor('B')">
                            ⚫ KataGo 执黑
                        </button>
                        <button class="btn btn-secondary" onclick="setKataGoColor('W')">
                            ⚪ KataGo 执白
                        </button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h2>GTP 命令</h2>
                    <input type="text" class="command-input" id="command-input" 
                           value="kata-genmove_analyze W 50" 
                           placeholder="输入 GTP 命令，如: kata-genmove_analyze W 50">
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="sendCommand()">
                            📨 发送命令
                        </button>
                        <button class="btn btn-secondary" onclick="testConnection()">
                            🔗 测试连接
                        </button>
                        <button class="btn btn-secondary" onclick="debugBoard()">
                            🐛 调试棋盘
                        </button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h2>通信日志</h2>
                    <div class="log-container" id="log-container">
                        <div class="log-entry">等待连接服务器...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="debug-info" id="debug-info" style="display: none;"></div>

    <script>
        // 全局变量
        const SERVER_URL = 'http://localhost:5001/gtp';
        let canvas, ctx;
        let boardSize = 19;
        let cellSize = 32; // 每个格子的大小
        let margin = 50;   // 边距
        let stones = [];
        let katagoColor = 'W';
        let humanColor = 'B';
        let currentTurn = 'B';
        let moveHistory = [];
        let isGameActive = false;
        let lastMoveStone = null;

        // 初始化棋盘
        function initBoard() {
            canvas = document.getElementById('go-board');
            ctx = canvas.getContext('2d');
            
            // 设置棋盘尺寸
            const boardWidth = (boardSize - 1) * cellSize + margin * 2;
            const boardHeight = boardWidth;
            
            canvas.width = boardWidth;
            canvas.height = boardHeight;
            canvas.style.width = boardWidth + 'px';
            canvas.style.height = boardHeight + 'px';
            
            console.log(`棋盘初始化: ${boardWidth}×${boardHeight}, 格子:${cellSize}, 边距:${margin}`);
            
            drawBoard();
            createBoardLabels();
            testConnection();
            
            // 添加点击事件
            canvas.addEventListener('click', handleBoardClick);
        }

        // 绘制棋盘 - 修复版
        function drawBoard() {
            const boardWidth = canvas.width;
            const boardHeight = canvas.height;
            
            console.log(`开始绘制棋盘: ${boardWidth}×${boardHeight}`);
            
            // 1. 绘制背景色
            ctx.fillStyle = '#dcb35c'; // 棋盘木色
            ctx.fillRect(0, 0, boardWidth, boardHeight);
            
            // 2. 绘制边框
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, boardWidth, boardHeight);
            
            // 3. 绘制网格线
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            
            // 计算网格范围
            const gridStartX = margin;
            const gridStartY = margin;
            const gridEndX = boardWidth - margin;
            const gridEndY = boardHeight - margin;
            
            console.log(`网格范围: X(${gridStartX}~${gridEndX}), Y(${gridStartY}~${gridEndY})`);
            
            // 绘制横线
            for (let i = 0; i < boardSize; i++) {
                const y = gridStartY + i * cellSize;
                
                ctx.beginPath();
                ctx.moveTo(gridStartX, y);
                ctx.lineTo(gridEndX, y);
                ctx.stroke();
                
                // 调试：显示每条线的位置
                if (i === 0 || i === 9 || i === 18) {
                    console.log(`横线 ${i}: y=${y}`);
                }
            }
            
            // 绘制竖线
            for (let i = 0; i < boardSize; i++) {
                const x = gridStartX + i * cellSize;
                
                ctx.beginPath();
                ctx.moveTo(x, gridStartY);
                ctx.lineTo(x, gridEndY);
                ctx.stroke();
                
                // 调试：显示每条线的位置
                if (i === 0 || i === 9 || i === 18) {
                    console.log(`竖线 ${i}: x=${x}`);
                }
            }
            
            // 4. 绘制星位点（天元和四角）
            drawStarPoints();
            
            // 5. 绘制棋子
            drawStones();
            
            console.log('棋盘绘制完成');
        }

        // 绘制星位点
        function drawStarPoints() {
            const starPoints = [3, 9, 15]; // 19路棋盘的星位位置
            const starRadius = 4;
            
            ctx.fillStyle = '#000000';
            
            for (let xIndex of starPoints) {
                for (let yIndex of starPoints) {
                    // 只在天元和四角、四边绘制星位
                    if ((xIndex === 9 && yIndex === 9) || // 天元
                        (xIndex === 3 && yIndex === 3) || // 左上角
                        (xIndex === 3 && yIndex === 15) || // 左下角
                        (xIndex === 15 && yIndex === 3) || // 右上角
                        (xIndex === 15 && yIndex === 15) || // 右下角
                        (xIndex === 9 && (yIndex === 3 || yIndex === 15)) || // 左右边
                        (yIndex === 9 && (xIndex === 3 || xIndex === 15))) { // 上下边
                        
                        const x = margin + xIndex * cellSize;
                        const y = margin + yIndex * cellSize;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, starRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        // 绘制所有棋子
        function drawStones() {
            stones.forEach(stone => {
                drawStone(stone.x, stone.y, stone.color, stone.moveNumber);
            });
        }

        // 绘制单个棋子
        function drawStone(boardX, boardY, color, moveNumber = null) {
            const x = margin + boardX * cellSize;
            const y = margin + boardY * cellSize;
            const radius = cellSize * 0.45;
            
            // 创建渐变效果
            const gradient = ctx.createRadialGradient(
                x - radius/3, y - radius/3, 1,
                x, y, radius
            );
            
            if (color === 'B') {
                gradient.addColorStop(0, '#666');
                gradient.addColorStop(1, '#000');
            } else {
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(1, '#ccc');
            }
            
            // 绘制棋子
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 白棋加边框
            if (color === 'W') {
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // 如果是最后落子，加高亮边框
            if (lastMoveStone && lastMoveStone.x === boardX && lastMoveStone.y === boardY) {
                ctx.beginPath();
                ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            
            // 绘制手数编号
            if (moveNumber && moveNumber > 0) {
                ctx.fillStyle = color === 'B' ? '#fff' : '#000';
                ctx.font = `bold ${Math.floor(cellSize * 0.35)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 确保文字清晰
                ctx.strokeStyle = color === 'B' ? '#000' : '#fff';
                ctx.lineWidth = 1;
                ctx.strokeText(moveNumber, x, y);
                ctx.fillText(moveNumber, x, y);
            }
        }

        // 创建棋盘坐标标签
        function createBoardLabels() {
            const rowLabels = document.getElementById('row-labels');
            const colLabels = document.getElementById('col-labels');
            
            // 清空现有标签
            rowLabels.innerHTML = '';
            colLabels.innerHTML = '';
            
            // 行标签 (A, B, C, ..., T) - 19路棋盘从A到T，跳过I
            const rowLetters = [];
            for (let i = 0; i < 26; i++) {
                let letter = String.fromCharCode(65 + i);
                if (letter === 'I') continue; // 跳过I
                if (rowLetters.length >= 19) break;
                rowLetters.push(letter);
            }
            
            // 添加行标签（左侧）
            for (let i = 0; i < boardSize; i++) {
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = rowLetters[i];
                rowLabels.appendChild(label);
            }
            
            // 列标签 (1-19) 从上到下
            for (let i = 0; i < boardSize; i++) {
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = boardSize - i;
                colLabels.appendChild(label);
            }
        }

        // 坐标转换：棋盘坐标转数组索引
        function coordinateToIndex(coord) {
            if (!coord || coord.length < 2) {
                console.error('无效坐标:', coord);
                return null;
            }
            
            const colChar = coord[0].toUpperCase();
            const rowStr = coord.substring(1);
            
            // 检查是否是 pass
            if (coord.toUpperCase() === 'PASS') {
                return { x: -1, y: -1, isPass: true };
            }
            
            // 列转换：A=0, B=1, ..., H=7, J=8, ..., T=18 (跳过I)
            let col = colChar.charCodeAt(0) - 65;
            if (col >= 8) col--; // 跳过I
            
            // 行转换：1=18, 2=17, ..., 19=0
            let row;
            try {
                row = boardSize - parseInt(rowStr);
                if (row < 0 || row >= boardSize) {
                    console.error('行数超出范围:', rowStr, '->', row);
                    return null;
                }
            } catch (e) {
                console.error('行数解析错误:', rowStr, e);
                return null;
            }
            
            if (col < 0 || col >= boardSize) {
                console.error('列数超出范围:', colChar, '->', col);
                return null;
            }
            
            return { x: col, y: row };
        }

        // 坐标转换：数组索引转棋盘坐标
        function indexToCoordinate(x, y) {
            if (x < 0 || x >= boardSize || y < 0 || y >= boardSize) {
                return 'PASS';
            }
            
            // 列：0=A, 1=B, ..., 7=H, 8=J, ..., 18=T (跳过I)
            let colChar;
            if (x < 8) {
                colChar = String.fromCharCode(65 + x);
            } else {
                colChar = String.fromCharCode(66 + x); // 跳过I
            }
            
            // 行：0=19, 1=18, ..., 18=1
            const row = boardSize - y;
            
            return `${colChar}${row}`;
        }

        // 处理棋盘点击
        function handleBoardClick(event) {
            if (!isGameActive) {
                alert('请先开始新游戏！');
                return;
            }
            
            if (currentTurn !== humanColor) {
                alert(`现在轮到 KataGo 落子（执${katagoColor === 'B' ? '黑' : '白'}）`);
                return;
            }
            
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            
            // 计算最近的交叉点
            const gridX = Math.round((clickX - margin) / cellSize);
            const gridY = Math.round((clickY - margin) / cellSize);
            
            // 检查是否在棋盘范围内
            if (gridX >= 0 && gridX < boardSize && gridY >= 0 && gridY < boardSize) {
                // 落子
                if (placeStone(gridX, gridY, humanColor)) {
                    // 如果是 KataGo 回合，自动请求 KataGo 思考
                    if (currentTurn === katagoColor) {
                        setTimeout(() => {
                            requestKataGoMove();
                        }, 500);
                    }
                }
            } else {
                console.log(`点击位置超出范围: (${gridX}, ${gridY})`);
            }
        }

        // 落子
        function placeStone(x, y, color) {
            // 检查该位置是否已有棋子
            if (stones.some(stone => stone.x === x && stone.y === y)) {
                addLog('错误', `位置 ${indexToCoordinate(x, y)} 已有棋子`, 'error');
                return false;
            }
            
            const moveNumber = stones.length + 1;
            const stone = { x, y, color, moveNumber };
            stones.push(stone);
            lastMoveStone = stone;
            moveHistory.push(stone);
            
            // 重绘棋盘
            drawBoard();
            
            // 切换回合
            currentTurn = color === 'B' ? 'W' : 'B';
            updateStatus();
            
            addLog('落子', `${color === 'B' ? '黑' : '白'}棋落子 ${indexToCoordinate(x, y)} (第${moveNumber}手)`);
            
            return true;
        }

        // 处理 KataGo 返回的着法
        function processKataGoMove(response) {
            try {
                const data = typeof response === 'string' ? JSON.parse(response) : response;
                
                if (data.success && data.result) {
                    const result = data.result;
                    console.log('KataGo 返回结果:', result);
                    
                    // 解析 "= play R16" 格式
                    if (result.startsWith('= play ')) {
                        const move = result.substring(7).trim();
                        const coord = coordinateToIndex(move);
                        
                        if (coord) {
                            // 检查是否是 pass
                            if (coord.isPass || move.toUpperCase() === 'PASS') {
                                addLog('KataGo', 'KataGo 选择 PASS');
                                currentTurn = currentTurn === 'B' ? 'W' : 'B';
                                updateStatus();
                                return;
                            }
                            
                            // 落子
                            if (placeStone(coord.x, coord.y, katagoColor)) {
                                addLog('KataGo', `KataGo 落子 ${move}`);
                            }
                        } else {
                            addLog('错误', `无法解析着法坐标: ${move}`, 'error');
                        }
                    } else {
                        addLog('KataGo', `返回结果: ${result}`);
                    }
                } else {
                    addLog('错误', `命令执行失败: ${data.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                addLog('错误', `解析响应失败: ${error.message}`, 'error');
            }
        }

        // 发送 GTP 命令
        async function sendCommand() {
            const commandInput = document.getElementById('command-input');
            const command = commandInput.value.trim();
            
            if (!command) {
                alert('请输入 GTP 命令');
                return;
            }
            
            addLog('发送', command, 'sent');
            
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ command })
                });
                
                console.log('命令响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                addLog('接收', JSON.stringify(data), 'received');
                
                // 特殊处理分析命令
                if (command.includes('kata-genmove_analyze')) {
                    processKataGoMove(data);
                }
                
            } catch (error) {
                console.error('发送命令失败:', error);
                addLog('错误', `请求失败: ${error.message}`, 'error');
            }
        }

        // 请求 KataGo 思考并落子
        async function requestKataGoMove() {
            if (!isGameActive) {
                alert('请先开始新游戏！');
                return;
            }
            
            if (currentTurn !== katagoColor) {
                alert(`现在轮到${currentTurn === 'B' ? '黑' : '白'}方落子，KataGo 执${katagoColor === 'B' ? '黑' : '白'}`);
                return;
            }
            
            const command = `kata-genmove_analyze ${katagoColor} 50`;
            document.getElementById('command-input').value = command;
            
            addLog('发送', command, 'sent');
            
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ command })
                });
                
                const data = await response.json();
                addLog('接收', JSON.stringify(data), 'received');
                
                processKataGoMove(data);
                
            } catch (error) {
                addLog('错误', `请求失败: ${error.message}`, 'error');
            }
        }

        // 开始新游戏
        function startNewGame() {
            stones = [];
            moveHistory = [];
            lastMoveStone = null;
            currentTurn = 'B';
            isGameActive = true;
            
            // 重绘棋盘
            drawBoard();
            
            // 发送清盘命令
            sendClearBoard();
            
            // 发送设置棋盘大小命令
            setTimeout(() => {
                sendCommandDirect(`boardsize ${boardSize}`);
            }, 100);
            
            // 发送设置贴目命令
            setTimeout(() => {
                sendCommandDirect('komi 7.5');
            }, 200);
            
            updateStatus();
            
            addLog('游戏', '新游戏开始！');
            
            // 如果 KataGo 执黑，让它先走
            if (katagoColor === 'B') {
                setTimeout(() => {
                    requestKataGoMove();
                }, 500);
            }
        }

        // 直接发送命令
        async function sendCommandDirect(command) {
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command })
                });
                
                const data = await response.json();
                if (data.success) {
                    console.log(`命令成功: ${command}`);
                } else {
                    console.log(`命令失败: ${command}`, data.error);
                }
            } catch (error) {
                console.error('发送命令失败:', error);
            }
        }

        // 清空棋盘
        function clearBoard() {
            stones = [];
            moveHistory = [];
            lastMoveStone = null;
            drawBoard();
            addLog('棋盘', '棋盘已清空');
        }

        // 发送清盘命令
        function sendClearBoard() {
            sendCommandDirect('clear_board');
        }

        // 悔棋
        function undoMove() {
            if (stones.length === 0) {
                addLog('悔棋', '没有可悔的着法');
                return;
            }
            
            const lastStone = stones.pop();
            moveHistory.pop();
            
            lastMoveStone = stones.length > 0 ? stones[stones.length - 1] : null;
            
            currentTurn = lastStone.color === 'B' ? 'B' : 'W';
            
            sendCommandDirect('undo');
            
            drawBoard();
            updateStatus();
            
            addLog('悔棋', `撤消 ${lastStone.color === 'B' ? '黑' : '白'}棋 ${indexToCoordinate(lastStone.x, lastStone.y)}`);
        }

        // 设置 KataGo 颜色
        function setKataGoColor(color) {
            katagoColor = color;
            humanColor = color === 'B' ? 'W' : 'B';
            
            document.getElementById('katago-color').textContent = 
                `${color === 'B' ? '黑色 (B)' : '白色 (W)'}`;
            
            addLog('设置', `KataGo 执${color === 'B' ? '黑' : '白'}，人类执${humanColor === 'B' ? '黑' : '白'}`);
            updateStatus();
        }

        // 测试服务器连接
        async function testConnection() {
            const statusElement = document.getElementById('server-status');
            const indicator = statusElement.querySelector('.status-indicator');
            const textSpan = statusElement.querySelector('span:last-child');
            
            console.log('正在测试连接到:', SERVER_URL);
            
            indicator.className = 'status-indicator status-disconnected';
            textSpan.textContent = '连接中...';
            
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: 'protocol_version' })
                });
                
                console.log('响应状态:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('响应数据:', data);
                    
                    if (data.success) {
                        indicator.className = 'status-indicator status-connected';
                        textSpan.textContent = '已连接';
                        addLog('连接', '服务器连接成功！', 'received');
                    } else {
                        indicator.className = 'status-indicator status-disconnected';
                        textSpan.textContent = '服务器错误';
                        addLog('连接', `服务器错误: ${data.error}`, 'error');
                    }
                } else {
                    indicator.className = 'status-indicator status-disconnected';
                    textSpan.textContent = 'HTTP错误';
                    addLog('连接', `HTTP ${response.status}: ${response.statusText}`, 'error');
                }
                
            } catch (error) {
                console.error('连接测试失败:', error);
                indicator.className = 'status-indicator status-disconnected';
                textSpan.textContent = '连接失败';
                
                let errorMsg = error.message;
                if (error.message.includes('Failed to fetch')) {
                    errorMsg = '无法连接到服务器。请检查服务器是否运行';
                }
                
                addLog('连接', errorMsg, 'error');
            }
        }

        // 调试棋盘
        function debugBoard() {
            const debugInfo = document.getElementById('debug-info');
            const info = `
                棋盘尺寸: ${canvas.width}×${canvas.height}<br>
                格子大小: ${cellSize}<br>
                边距: ${margin}<br>
                网格范围: X(${margin}~${canvas.width-margin})<br>
                棋子数量: ${stones.length}<br>
                当前回合: ${currentTurn}
            `;
            
            debugInfo.innerHTML = info;
            debugInfo.style.display = 'block';
            
            // 绘制调试网格
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            
            // 复制当前棋盘
            tempCtx.drawImage(canvas, 0, 0);
            
            // 绘制网格点
            tempCtx.fillStyle = 'red';
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    const x = margin + i * cellSize;
                    const y = margin + j * cellSize;
                    tempCtx.beginPath();
                    tempCtx.arc(x, y, 2, 0, Math.PI * 2);
                    tempCtx.fill();
                }
            }
            
            // 显示调试图像
            const debugWindow = window.open();
            debugWindow.document.write('<img src="' + tempCanvas.toDataURL() + '" />');
            
            addLog('调试', '已打开调试窗口，显示网格点');
        }

        // 更新状态显示
        function updateStatus() {
            document.getElementById('current-turn').textContent = 
                `${currentTurn === 'B' ? '黑方' : '白方'}${currentTurn === katagoColor ? ' (KataGo)' : ' (人类)'}`;
            
            const btn = document.getElementById('btn-katago-move');
            if (currentTurn === katagoColor && isGameActive) {
                btn.disabled = false;
                btn.classList.add('pulsing');
            } else {
                btn.disabled = true;
                btn.classList.remove('pulsing');
            }
        }

        // 更新着法历史
        function updateMoveHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            stones.forEach((stone, index) => {
                const item = document.createElement('span');
                item.className = 'history-item';
                item.textContent = `${index + 1}. ${stone.color === 'B' ? '黑' : '白'}${indexToCoordinate(stone.x, stone.y)}`;
                item.style.cursor = 'pointer';
                
                item.onclick = () => {
                    lastMoveStone = stone;
                    drawBoard();
                };
                
                historyList.appendChild(item);
            });
        }

        // 添加日志
        function addLog(type, message, cssClass = '') {
            const logContainer = document.getElementById('log-container');
            const logEntry = document.createElement('div');
            
            const timestamp = new Date().toLocaleTimeString();
            logEntry.className = `log-entry log-${cssClass || 'received'}`;
            logEntry.innerHTML = `<strong>[${timestamp}] ${type}:</strong> ${message}`;
            
            logContainer.appendChild(logEntry);
            
            if (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.firstChild);
            }
            
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 键盘快捷键
        document.addEventListener('keydown', (event) => {
            if (event.ctrlKey || event.metaKey) {
                switch (event.key.toLowerCase()) {
                    case 'n':
                        event.preventDefault();
                        startNewGame();
                        break;
                    case 'k':
                        event.preventDefault();
                        requestKataGoMove();
                        break;
                    case 'z':
                        if (event.shiftKey) {
                            event.preventDefault();
                            undoMove();
                        }
                        break;
                }
            }
            
            if (event.key === 'Enter' && document.activeElement.id === 'command-input') {
                event.preventDefault();
                sendCommand();
            }
        });

        // 初始化
        window.onload = initBoard;
        
        console.log('围棋界面已加载');
    </script>
</body>
</html>
